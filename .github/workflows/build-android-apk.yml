name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ android-app-build ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" "build-tools;33.0.0"

      - name: Build Debug APK
        run: |
          cd apps/android
          chmod +x ./gradlew
          ./gradlew :app:assemblePlayDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-debug
          path: apps/android/app/build/outputs/apk/play/debug/*.apk
          retention-days: 14
          if-no-files-found: error
